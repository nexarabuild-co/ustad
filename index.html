<style>
/* Layout: a field dossier — sticky file header, one scrolling column of "files", fixed bottom tab bar */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#E2E7EA; --ink:#13202A; --muted:#5A6873; --line:#CCD4DA;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D3EBE8;
  --amber:#9A5C0A; --amber-soft:#F5E6CC; --red:#B4312B; --red-soft:#F6DCDA; --green:#2C7A38;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16212A; --sunk:#1C2933; --ink:#E3EAEE; --muted:#93A3AE; --line:#2A3A46;
  --accent:#3BBFB7; --accent-ink:#06201E; --accent-soft:#163A3B;
  --amber:#E2A54C; --amber-soft:#3A2C17; --red:#F07A72; --red-soft:#3D1F1D; --green:#6CC07A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16212A; --sunk:#1C2933; --ink:#E3EAEE; --muted:#93A3AE; --line:#2A3A46;
  --accent:#3BBFB7; --accent-ink:#06201E; --accent-soft:#163A3B;
  --amber:#E2A54C; --amber-soft:#3A2C17; --red:#F07A72; --red-soft:#3D1F1D; --green:#6CC07A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em}
.fileno{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.top .grow{flex:1;min-width:0}
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--sunk);white-space:nowrap}
.pill.ok{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

main{max-width:760px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:var(--surface);font-size:10px;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0 4px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stamp.amber{color:var(--amber)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--amber)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.mic.on{background:var(--red);border-color:var(--red);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

textarea,input[type=text],input[type=number],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-width:0}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f span{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.ai{font-size:15px;line-height:1.65;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-wrap:anywhere}
.ai h2,.ai h3,.ai h4{font-family:var(--f-display);margin-top:6px}
.ai h2{font-size:18px}.ai h3{font-size:16px}.ai h4{font-size:15px}
.ai ul,.ai ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.ai blockquote{margin:0;border-left:3px solid var(--accent);padding:4px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.ai code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.ai hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.ai .tw{overflow-x:auto}
.ai table{border-collapse:collapse;font-size:14px;min-width:100%}
.ai th,.ai td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.ai th{background:var(--sunk)}
.thinking{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.thinking::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none}}
.err{color:var(--red);font-size:14px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.03em}
.tag{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.k-night{background:var(--accent-soft);color:var(--accent)}
.tag.k-debate{background:var(--red-soft);color:var(--red)}
.tag.k-lesson{background:var(--amber-soft);color:var(--amber)}
.check{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.done .t{text-decoration:line-through;color:var(--muted)}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:78px}
.cat b{font-family:var(--f-display);font-size:15px}
.cat span{font-size:12px;color:var(--muted)}

.flash{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px}
.flash .q{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.35}
.flash .a{background:var(--accent-soft);border-radius:8px;padding:12px;font-size:16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades .btn{flex-direction:column;gap:0;justify-content:center;padding:8px 4px}
.grades small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.g0{border-color:var(--red)!important;color:var(--red)}
.g3{border-color:var(--green)!important;color:var(--green)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.item .tick{font-family:var(--f-mono);width:18px;color:var(--accent);font-weight:600}
.item.done .t{color:var(--muted);text-decoration:line-through}
.item.opt{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;cursor:pointer}
.item.opt:first-child{border-top:1px solid var(--line)}
.item.opt b{font-family:var(--f-mono);color:var(--muted)}
.item.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.item.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.num{white-space:pre-line}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{cursor:pointer;position:relative}
.bigmic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:96px;height:96px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.bigmic svg{width:34px;height:34px}
.bigmic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.spk.on{outline:2px solid var(--accent)}
.bub .row{margin-top:6px}
.line{padding:8px 10px;border-radius:8px;border-left:3px solid var(--line)}
.line.whoA{border-left-color:var(--accent)}
.line.whoB{border-left-color:var(--amber)}
.line.whoU{border-left-color:var(--ink);background:var(--sunk)}
.line.now{background:var(--accent-soft)}
.slide{background:var(--ink);color:var(--bg);border-radius:12px;padding:22px 18px;min-height:280px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.slide .big{font-size:56px;line-height:1;font-family:var(--f-display);animation:pop .5s ease-out}
.slide h2{font-family:var(--f-display);font-size:24px;margin:0;animation:fade .5s ease-out;color:var(--bg)}
.slide li{color:var(--bg);font-size:16px}
.slide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.slide li{opacity:0;animation:fade .5s ease-out forwards}
.slide .dots{display:flex;gap:4px;margin-top:auto}
.slide .dots i{flex:1;height:3px;background:color-mix(in srgb,var(--bg) 30%,transparent);border-radius:2px}
.slide .dots i.on{background:var(--accent)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slide *, .bigmic.on{animation:none!important;opacity:1!important}}

.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;border-radius:12px;padding:10px 12px;min-width:0}
.bub.user{align-self:flex-end;background:var(--ink);color:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.assistant{align-self:flex-start;background:var(--sunk)}
.preview{max-height:260px;border-radius:8px;object-fit:contain;align-self:flex-start;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:13px}
.price-up{color:var(--red)} .price-down{color:var(--green)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
details summary{cursor:pointer;font-weight:600}
.frame h3{color:var(--accent)}
</style>

<script>
/* ===== Ustad phone app layer: Gemini AI, phone mic, downloads, restore ===== */
const GEM_BASE="https://generativelanguage.googleapis.com/v1beta/";
const LSG={key:"ustad-gem-key",model:"ustad-gem-model"};
function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }
function gemKey(){ return lsGet(LSG.key); }
function gemModel(){ return lsGet(LSG.model)||"gemini-flash-latest"; }
const IMG_LIM={mediaTypes:["image/jpeg","image/png","image/webp","image/heic"],maxInputBytes:15*1048576};

async function gemErr(r){
  let j=null; try{ j=await r.json(); }catch(e){}
  const msg=(j&&j.error&&j.error.message)||("HTTP "+r.status); const st=j&&j.error&&j.error.status;
  let code="error";
  if(r.status===429||st==="RESOURCE_EXHAUSTED") code="rate_limited";
  else if(/api key|api_key|permission/i.test(msg)||r.status===401||r.status===403) code="bad_key";
  else if(r.status===400&&/image|inline|mime/i.test(msg)) code="image_rejected";
  else if(r.status===404) code="bad_model";
  else if(r.status>=500) code="server";
  return {code,message:msg};
}
async function gemPickModel(key){
  const r=await fetch(GEM_BASE+"models?pageSize=1000",{headers:{"x-goog-api-key":key}});
  if(!r.ok) throw await gemErr(r);
  const j=await r.json();
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
  if(names.includes("gemini-flash-latest")) return "gemini-flash-latest";
  const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const fl=names.filter(n=>/^gemini-\d+(\.\d+)?-flash$/.test(n)).sort((a,b)=>ver(b)-ver(a));
  return fl[0]||names.filter(n=>/flash/.test(n)&&!/lite|image|tts|live|audio|embed/.test(n)).sort((a,b)=>ver(b)-ver(a))[0]||"gemini-2.5-flash";
}
function blobB64(b){ return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(String(f.result).split(",")[1]); f.onerror=()=>rej({code:"image_rejected"}); f.readAsDataURL(b); }); }
function gemSchema(s){
  if(Array.isArray(s)) return s.map(gemSchema);
  if(!s||typeof s!=="object") return s;
  const o={};
  for(const [k,v] of Object.entries(s)){
    if(["additionalProperties","$schema","default","examples"].includes(k)) continue;
    o[k]=k==="properties"?Object.fromEntries(Object.entries(v).map(([a,b])=>[a,gemSchema(b)])):gemSchema(v);
  }
  return o;
}
const partsText=c=>((c&&c.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("");
function gemCheck(j){
  if(j&&j.promptFeedback&&j.promptFeedback.blockReason) throw {code:"refused"};
  const c=j&&j.candidates&&j.candidates[0];
  if(c&&/SAFETY|PROHIBITED|BLOCKLIST|RECITATION/.test(c.finishReason||"")) return {blocked:true,c};
  return {c};
}

function makeGemini(){
  async function run(input,opts={},json=false){
    const key=gemKey(); if(!key) throw {code:"no_ai"};
    const msgs=typeof input==="string"?[{role:"user",content:input}]:input;
    const contents=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:String(m.content||"")}]}));
    if(opts.images&&opts.images.length){
      const last=contents[contents.length-1];
      for(const b of opts.images) last.parts.unshift({inline_data:{mime_type:b.type||"image/jpeg",data:await blobB64(b)}});
    }
    const body={contents,generationConfig:{maxOutputTokens:8192}};
    if(json) body.generationConfig.responseMimeType="application/json";
    const tools=opts.tools||[];
    if(tools.length) body.tools=[{functionDeclarations:tools.map(t=>{ const d={name:t.name,description:t.description||""}; const sc=t.inputSchema; if(sc&&sc.properties&&Object.keys(sc.properties).length) d.parameters=gemSchema(sc); return d; })}];
    const url=(m,s)=>GEM_BASE+"models/"+m+(s?":streamGenerateContent?alt=sse":":generateContent");
    const hdr={"Content-Type":"application/json","x-goog-api-key":key};
    let text="",truncated=false;
    try{
      if(opts.onText&&!tools.length){
        const r=await fetch(url(gemModel(),true),{method:"POST",headers:hdr,body:JSON.stringify(body),signal:opts.signal});
        if(!r.ok) throw await gemErr(r);
        const rd=r.body.getReader(); const dec=new TextDecoder(); let buf="";
        for(;;){
          const {value,done}=await rd.read(); if(done) break;
          buf+=dec.decode(value,{stream:true});
          let i; while((i=buf.indexOf("\n"))>=0){
            const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
            if(!line.startsWith("data:")) continue;
            let j; try{ j=JSON.parse(line.slice(5)); }catch(e){ continue; }
            const {c,blocked}=gemCheck(j); if(blocked&&!text) throw {code:"refused"};
            const d=partsText(c&&c.content); if(d){ text+=d; try{ opts.onText({text,delta:d}); }catch(e){} }
            if(c&&c.finishReason==="MAX_TOKENS") truncated=true;
          }
        }
        if(!text) throw {code:"empty"};
        return {text,truncated};
      }
      for(let round=0;round<6;round++){
        const r=await fetch(url(gemModel(),false),{method:"POST",headers:hdr,body:JSON.stringify(body),signal:opts.signal});
        if(!r.ok) throw await gemErr(r);
        const j=await r.json(); const {c,blocked}=gemCheck(j);
        if(blocked||!c) throw {code:blocked?"refused":"empty"};
        const calls=((c.content&&c.content.parts)||[]).filter(p=>p.functionCall);
        if(calls.length&&round<5){
          body.contents.push(c.content);
          const resp=[];
          for(const p of calls){
            const t=tools.find(x=>x.name===p.functionCall.name); let out;
            try{ out=t?await t.execute(p.functionCall.args||{}):{error:"unknown tool"}; }catch(e){ out={error:String(e&&e.message||e)}; }
            resp.push({functionResponse:{name:p.functionCall.name,response:{result:out}}});
          }
          body.contents.push({role:"user",parts:resp});
          continue;
        }
        text=partsText(c.content); truncated=c.finishReason==="MAX_TOKENS";
        if(!text) throw {code:"empty"};
        if(opts.onText) try{ opts.onText({text,delta:text}); }catch(e){}
        return {text,truncated};
      }
      throw {code:"empty"};
    }catch(e){
      if(e&&e.name==="AbortError") throw {code:"cancelled",text};
      if(e instanceof TypeError) throw {code:"offline"};
      throw e;
    }
  }
  const sample=(input,opts)=>run(input,opts,false);
  sample.json=async(input,opts)=>{
    const r=await run(input,opts,true); const t=r.text.trim();
    try{ return JSON.parse(t); }catch(e){}
    const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
    try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw {code:"bad_json"}; }
  };
  sample.limits=async()=>({images:IMG_LIM});
  return sample;
}

function makeDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null,on=false; const fin=[],st=[];
  const emit=(a,v)=>a.forEach(f=>{ try{ f(v); }catch(e){} });
  return {
    active:()=>on,
    start(){ return new Promise((res,rej)=>{
      try{ rec=new SR(); }catch(e){ rej({code:"unavailable"}); return; }
      rec.lang=S.settings.micLang||"ur-PK"; rec.interimResults=false; rec.continuous=false; rec.maxAlternatives=1;
      let started=false;
      rec.onstart=()=>{ started=true; on=true; emit(st,{state:"listening"}); res(); };
      rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) emit(fin,{text:" "+e.results[i][0].transcript.trim()}); };
      rec.onerror=e=>{ const c=/not-allowed|service-not-allowed/.test(e.error)?"not_granted":e.error==="no-speech"?"stopped":e.error; if(!started) rej({code:c}); else if(c!=="stopped"&&c!=="aborted") toast("Mic: "+c); };
      rec.onend=()=>{ on=false; emit(st,{state:"idle",reason:"stopped"}); if(!started) rej({code:"unavailable"}); };
      try{ rec.start(); }catch(e){ rej({code:"unavailable"}); }
    }); },
    stop(){ try{ rec&&rec.stop(); }catch(e){} return Promise.resolve(); },
    onFinal(f){ fin.push(f); }, onState(f){ st.push(f); }
  };
}

/* ---------- markdown ---------- */
function md(src){
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
  let out="",list=null,para=[],tbl=[];
  const fP=()=>{if(para.length){out+="<p>"+para.map(inline).join("<br>")+"</p>";para=[];}};
  const fL=()=>{if(list){out+="</"+list+">";list=null;}};
  const fT=()=>{ if(!tbl.length) return; const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r.trim())).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    out+='<div class="tw"><table>'+rows.map((r,i)=>"<tr>"+r.map(c=>i===0?"<th>"+inline(c)+"</th>":"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</table></div>"; tbl=[]; };
  for(const raw of String(src||"").split("\n")){
    const l=raw.trimEnd(); let m;
    if(l.trim().startsWith("|")){fP();fL();tbl.push(l);continue;} else fT();
    if(!l.trim()){fP();fL();continue;}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fP();fL();const n=Math.min(m[1].length+1,4);out+=`<h${n}>${inline(m[2])}</h${n}>`;continue;}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){fP();if(list!=="ul"){fL();out+="<ul>";list="ul";}out+="<li>"+inline(m[1])+"</li>";continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fP();if(list!=="ol"){fL();out+="<ol>";list="ol";}out+="<li>"+inline(m[1])+"</li>";continue;}
    if((m=l.match(/^>\s?(.*)/))){fP();fL();out+="<blockquote>"+inline(m[1])+"</blockquote>";continue;}
    if(/^-{3,}$/.test(l.trim())){fP();fL();out+="<hr>";continue;}
    fL();para.push(l);
  }
  fT();fP();fL();return out;
}

async function ask(input,{out,images,tier,stopBtn,tools}={}){
  if(!S.sample) throw {code:"no_ai"};
  const ctl=new AbortController();
  if(stopBtn){stopBtn.hidden=false;stopBtn.onclick=()=>ctl.abort();}
  if(out) out.innerHTML='<p class="thinking">Ustad soch raha hai</p>';
  const opts={signal:ctl.signal,cache:false,onText:({text})=>{ if(out) out.innerHTML=md(text.split(MARK)[0]); }};
  if(tier) opts.modelTier=tier;
  if(images) opts.images=images;
  if(tools) opts.tools=tools;
  try{
    const r=await S.sample(input,opts);
    const parts=r.text.split(MARK); const body=parts[0].trim(); let meta=null;
    if(parts[1]){ try{const j=parts[1]; meta=JSON.parse(j.slice(j.indexOf("{"),j.lastIndexOf("}")+1));}catch(e){} }
    if(out){ out.innerHTML=md(body); if(r.truncated) out.append(el("p",{class:"muted small",text:"Jawab lamba tha, beech mein kat gaya."})); }
    return {body,meta};
  } finally { if(stopBtn) stopBtn.hidden=true; }
}
async function saveNote({kind,text,body,meta,extra}){
  const id=uid(); const cat=normCat(meta&&meta.cat); const sub=(meta&&meta.sub)||"";
  const note={kind,text:text||"",ai:body||"",title:(meta&&meta.title)||(text||kind).slice(0,70),cat,sub,ts:Date.now(),day:today(),...(extra||{})};
  await store.put("notes",id,note);
  const cards=((meta&&meta.cards)||[]).filter(c=>c&&c.q&&c.a).slice(0,12);
  const due=kind==="morning"?Date.now():tomorrowMorning();
  await Promise.all(cards.map(c=>store.put("cards",uid(),{q:String(c.q),a:String(c.a),cat,sub,src:id,created:Date.now(),due,ivl:0,ease:2.5,reps:0,lapses:0})));
  const tasks=((meta&&meta.tasks)||[]).filter(t=>typeof t==="string"&&t.trim()).slice(0,6);
  await Promise.all(tasks.map(t=>store.put("tasks",uid(),{text:t.trim(),done:false,ts:Date.now()})));
  toast("Save ho gaya · "+cards.length+" yaad-cards"+(tasks.length?" · "+tasks.length+" kaam":""));
  return id;
}
/* runs an AI job inside a card: returns output node; handles errors + raw save */
function aiBlock(){ const out=el("div",{class:"ai"}); const stop=el("button",{class:"btn sm ghost",type:"button",hidden:true},"Roko"); const wrap=el("div",{class:"stack"},out,el("div",{class:"row end"},stop)); return {wrap,out,stop}; }
async function runAI({prompt,kind,text,images,tier,blk,extra,noSave}){
  try{
    const r=await ask(prompt,{out:blk.out,images,tier,stopBtn:blk.stop});
    if(noSave) return r;
    const id=await saveNote({kind,text,body:r.body,meta:r.meta,extra});
    blk.out.append(el("div",{class:"row"},el("button",{class:"btn sm",type:"button",onclick:()=>go("note",id)},"Note kholo aur aur poocho")));
    return r;
  }catch(e){
    if(e&&e.code==="cancelled"&&e.text){ blk.out.innerHTML=md(e.text.split(MARK)[0]); }
    else blk.out.replaceChildren(el("p",{class:"err",text:errMsg(e)}));
    if(!noSave && text && !(e&&e.code==="cancelled")){ await saveNote({kind,text,body:"",meta:null,extra}); blk.out.append(el("p",{class:"muted small",text:"Aap ka likha hua save kar liya hai. AI baad mein note khol kar chala sakte hain."})); }
    return null;
  }
}

const MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function micBtn(target){

    if(S.dict.active()){ S.dict.stop(); return; }
    S.dictTarget=target;

  });

}
function wireDictation(){
  if(!S.dict) return;
  S.dict.onFinal(({text})=>{ const t=S.dictTarget; if(!t||!t.isConnected) return; t.value=(t.value?t.value:"")+(t.value?text:text.trimStart()); t.dispatchEvent(new Event("input")); });
  S.dict.onState(({state})=>{ document.querySelectorAll(".mic").forEach(m=>m.classList.toggle("on",state!=="idle")); if(state==="idle"&&S.dictDone){ const f=S.dictDone; S.dictDone=null; f(); } });
}

/* ---------- voice out (Claude voice, else browser voice) ---------- */
const VO={cb:null};
const clean=t=>String(t||"").replace(/[#*_`>|]/g,"").replace(/\s+/g," ").trim();
function wireTTS(){ if(!S.tts) return;
  S.tts.onLine(e=>{ VO.cb&&VO.cb(e.id); });
  S.tts.onState(({state,reason})=>{ document.querySelectorAll(".spk").forEach(b=>b.classList.toggle("on",state!=="idle")); if(state==="idle"&&(reason==="not_granted"||reason==="unavailable")) S.ttsOff=true; }); }
function voiceOK(){ return !S.ttsOff&&(!!S.tts||("speechSynthesis" in window)); }
function browserVoice(){ const vs=speechSynthesis.getVoices(); for(const p of ["en-in","en-pk","hi-in","en-gb","en"]){ const v=vs.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(p)); if(v) return v; } return null; }
async function speakLines(lines,onLine){
  VO.cb=onLine||null; const rate=S.settings.rate||1;
  if(S.tts&&!S.ttsOff){
    try{ await S.tts.speak(lines.filter(l=>clean(l.text)).map((l,i)=>({text:clean(l.text).slice(0,1990),voice:l.who==="B"?"airy":l.who==="C"?"rounded":"buttery",id:String(l.id!=null?l.id:i)})),{rate}); return true; }
    catch(e){ if(e.code==="not_granted"||e.code==="unavailable"){S.ttsOff=true;toast("Awaaz band hai. Artifact ke Permissions menu se on kar sakte hain.");} else if(e.code==="no_gesture") toast("Ek dafa screen par tap karo, phir Play dabao."); else if(e.code!=="stopped") toast("Awaaz: "+e.code); return false; }
  }
  if(S.ttsOff||!("speechSynthesis" in window)) return false;
  const chunks=[]; lines.forEach((l,i)=>{ const id=String(l.id!=null?l.id:i); (clean(l.text).match(/[^.!?؟]+[.!?؟]*\s*/g)||[]).reduce((a,s)=>{ if(a.length&&(a[a.length-1]+s).length<220) a[a.length-1]+=s; else a.push(s); return a; },[]).forEach((t,j)=>chunks.push({t,id,who:l.who,first:j===0})); });
  return new Promise(res=>{ speechSynthesis.cancel(); let i=0; const v=browserVoice();
    const next=()=>{ if(i>=chunks.length){res(true);return;} const c=chunks[i]; const u=new SpeechSynthesisUtterance(c.t); if(v){u.voice=v;u.lang=v.lang;} u.rate=rate; u.pitch=c.who==="B"?1.35:c.who==="C"?0.75:1;
      u.onstart=()=>{ if(c.first&&VO.cb) VO.cb(c.id); }; u.onend=()=>{i++;next();}; u.onerror=()=>res(false); speechSynthesis.speak(u); };
    next(); });
}
function stopVoice(){ VO.cb=null; if(S.tts) S.tts.stop().catch(()=>{}); if("speechSynthesis" in window) speechSynthesis.cancel(); }

/* ---------- push-to-talk: dictation, else browser speech recognition, else keyboard ---------- */
function talkBox({placeholder,onSend}){
  const ta=el("textarea",{placeholder:placeholder||"Bolo ya likho",style:"min-height:60px"});
  const big=el("button",{class:"bigmic mic",type:"button","aria-label":"Bolo"});
  big.innerHTML=MIC_SVG+"<span>Bolo</span>";
  const send=()=>{ const v=ta.value.trim(); if(!v) return; ta.value=""; onSend(v); };
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null;
  big.onclick=()=>{
    stopVoice();
    if(S.dict){
      if(S.dict.active()){ S.dict.stop(); return; }
      S.dictTarget=ta; S.dictDone=()=>{ if(ta.isConnected&&ta.value.trim()) send(); };
      S.dict.start().catch(e=>{ S.dictDone=null; if(e.code==="not_granted"||e.code==="unavailable"){S.dict=null;toast("App ka mic nahi mila. Dobara dabao.");} else if(e.code!=="stopped"&&e.code!=="dismissed") toast("Mic: "+e.code); });
      return;
    }
    if(SR&&!S.srBlocked){
      if(rec){ rec.stop(); return; }
      rec=new SR(); rec.lang=S.settings.micLang||"ur-PK"; rec.interimResults=false; rec.continuous=false;
      rec.onresult=e=>{ ta.value=(ta.value+" "+Array.from(e.results).map(r=>r[0].transcript).join(" ")).trim(); };
      rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){S.srBlocked=true;toast("Mic ki ijazat nahi mili. Keyboard ka mic dabao.");ta.focus();} };
      rec.onend=()=>{ rec=null; big.classList.remove("on"); if(ta.value.trim()) send(); };
      try{ rec.start(); big.classList.add("on"); }catch(e){ rec=null; S.srBlocked=true; toast("Keyboard ka mic dabao."); ta.focus(); }
      return;
    }
    toast("Phone keyboard ka mic dabao, bolo, phir Bhejo."); ta.focus();
  };
  const sendB=el("button",{class:"btn primary",type:"button",onclick:send},"Bhejo");
  return el("div",{class:"stack"},el("div",{class:"row",style:"justify-content:center"},big),el("div",{class:"row",style:"align-items:flex-start"},el("div",{class:"grow"},ta),sendB));
}

function likhoPrompt(mode,text){
  const P=persona();
  if(mode==="question") return P+`\n\nUser ka sawal:\n"""${text}"""\n\nGehra, expert-level jawab do: bunyaad, details, misaalein, aam ghalat-fehmiyan, expert ko kaise judge karein, aur 3 pro-level sawal jo user aage kisi expert se pooch sakein.`+jsonTail();
  if(mode==="replay") return P+`\n\nUser ki kisi se behas hui thi:\n"""${text}"""\n\nBatao:\n## Kya hua\nDono taraf ka khulasa.\n## Doosre bande ke sab se mazboot points\n## Aap kya behtar keh sakte the\nTayyar jumlay Roman Urdu mein, jo agli dafa bol sakein.\n## Facts jo kaam aate\n## Ghaltiyan\nDono taraf ki logical fallacies ya kamzor dalail.\n## Agli dafa ke liye 3 lines\nYaad rakhne ke liye.`+jsonTail();

function schedule(c,q){

    reps++;
    if(reps===1) ivl=q===3?4:q===1?1:2;
    else if(reps===2) ivl=q===1?3:q===3?8:6;
    else ivl=Math.max(ivl+1,Math.round(ivl*(q===1?1.2:q===3?ease*1.3:ease)));
    ease=Math.max(1.3,ease+(q===1?-0.15:q===3?0.15:0));
    due=now+ivl*DAY;
  }
  return {ivl,ease,reps,lapses,due,last:now};
}

  const [db,sample,dict,downloads,tts]=await Promise.all([use("db"),use("sample"),use("dictation"),use("downloads"),use("tts")]);

    S.notes=[];S.cards=[];S.tasks=[];S.prices=[];
    const slow=setTimeout(()=>toast("Data abhi load nahi hua. Internet check karein."),10000);
